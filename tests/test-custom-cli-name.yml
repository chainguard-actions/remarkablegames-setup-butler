name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cli-name: my-butler
      - name: Assert custom CLI name is installed
        run: |
          echo "Checking if my-butler is available in PATH..."
          if ! command -v my-butler &>/dev/null; then
            echo "FAIL: my-butler command not found in PATH"
            exit 1
          fi
          echo "PASS: my-butler found at $(command -v my-butler)"
      - name: Assert custom CLI name runs correctly
        run: |
          echo "Running my-butler --version..."
          my-butler --version
          echo "PASS: my-butler --version succeeded"
      - name: Assert default 'butler' name is NOT installed
        run: |
          echo "Checking that 'butler' is not in PATH (only custom name should be)..."
          if command -v butler &>/dev/null; then
            echo "NOTE: 'butler' also found at $(command -v butler) — may be acceptable depending on implementation"
          else
            echo "PASS: 'butler' not found, only custom name 'my-butler' is installed"
          fi
