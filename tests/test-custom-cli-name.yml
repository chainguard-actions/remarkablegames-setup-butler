name: Test custom CLI name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cli-name: my-butler
      - name: Assert custom CLI name is installed
        run: |
          echo "Checking my-butler is available in PATH..."
          if ! command -v my-butler &>/dev/null; then
            echo "FAIL: my-butler command not found in PATH"
            exit 1
          fi
          echo "PASS: my-butler found at $(command -v my-butler)"
      - name: Assert custom CLI runs
        run: |
          echo "Running my-butler version..."
          my-butler --version
          if [ $? -ne 0 ]; then
            echo "FAIL: my-butler --version exited with non-zero status"
            exit 1
          fi
          echo "PASS"
      - name: Assert default butler name is NOT installed
        run: |
          echo "Checking that 'butler' is not in PATH (only my-butler should be)..."
          if command -v butler &>/dev/null; then
            echo "NOTE: default 'butler' also found at $(command -v butler) - this may be expected if action adds both"
          fi
          echo "PASS: assertion complete"
