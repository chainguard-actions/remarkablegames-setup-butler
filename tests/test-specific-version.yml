name: Test specific butler version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          butler-version: 15.21.0
      - name: Assert butler is installed with correct version
        run: |
          echo "Checking butler is on PATH..."
          which butler || { echo "FAIL: butler not found on PATH"; exit 1; }
          echo "Checking butler version..."
          VERSION=$(butler --version 2>&1)
          echo "actual version output: $VERSION"
          if echo "$VERSION" | grep -q "15.21.0"; then
            echo "PASS: version 15.21.0 found"
          else
            echo "FAIL: expected version 15.21.0 in output: $VERSION"
            exit 1
          fi
