name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert butler is installed
        run: |
          echo "Checking butler is available in PATH..."
          if ! command -v butler &>/dev/null; then
            echo "FAIL: butler command not found in PATH"
            exit 1
          fi
          echo "PASS: butler found at $(command -v butler)"
      - name: Assert butler runs
        run: |
          echo "Running butler version..."
          butler --version
          if [ $? -ne 0 ]; then
            echo "FAIL: butler --version exited with non-zero status"
            exit 1
          fi
          echo "PASS"
