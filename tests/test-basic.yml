name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert butler is installed and executable
        run: |
          echo "Checking butler is on PATH..."
          which butler || { echo "FAIL: butler not found on PATH"; exit 1; }
          echo "Checking butler version output..."
          butler --version || { echo "FAIL: butler --version failed"; exit 1; }
          echo "PASS"
