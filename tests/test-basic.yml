name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-populate tool cache with fake butler (LATEST)
        run: |
          TOOL_CACHE="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          BUTLER_ARCH_DIR="$TOOL_CACHE/butler/LATEST/x64"
          BUTLER_PARENT_DIR="$TOOL_CACHE/butler/LATEST"
          mkdir -p "$BUTLER_ARCH_DIR"
          printf '#!/bin/sh\nif [ "$1" = "--version" ]; then\n  echo "butler version LATEST (head), built on 2024-01-01"\n  exit 0\nfi\necho "butler: $*"\nexit 0\n' > "$BUTLER_ARCH_DIR/butler"
          chmod +x "$BUTLER_ARCH_DIR/butler"
          cp "$BUTLER_ARCH_DIR/butler" "$BUTLER_PARENT_DIR/butler"
          touch "${BUTLER_ARCH_DIR}.complete"
          echo "Tool cache populated:"
          ls -la "$BUTLER_ARCH_DIR"
          ls -la "$BUTLER_PARENT_DIR"

      - id: action
        uses: .

      - name: Assert butler is on PATH
        run: |
          echo "which butler: $(which butler || echo 'NOT FOUND')"
          if ! command -v butler > /dev/null 2>&1; then
            echo "FAIL: butler not found on PATH"
            exit 1
          fi
          echo "PASS: butler is available"

      - name: Assert butler runs
        run: |
          VERSION_OUTPUT="$(butler --version 2>&1 || true)"
          echo "butler --version: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: butler --version produced no output"
            exit 1
          fi
          echo "PASS: butler --version succeeded"
