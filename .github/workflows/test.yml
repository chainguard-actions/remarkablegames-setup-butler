name: test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint codebase
        run: npm run lint

      - name: Check type
        run: npm run lint:tsc

      - name: Run tests
        run: npm run test:ci

      - name: Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # action should work on a clean machine without building
  integration:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [LATEST, 15.26.1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run action
        uses: ./

      - name: Run action with inputs
        uses: ./
        with:
          butler-version: ${{ matrix.version }}
          cli-name: butler

      - name: Locate binary
        run: command -v butler

      - name: Check version
        if: matrix.version != 'LATEST'
        shell: bash
        env:
          MATRIX_VERSION: ${{ matrix.version }}
        run: |
          butler --version &> BUTLER_VERSION
          if [[ $(cat BUTLER_VERSION) != *"$MATRIX_VERSION"* ]]; then
            echo 'Version does not match. See version below:'
            butler --version
            exit 1
          fi

      - name: Show help
        run: butler --help
